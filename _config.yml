title: Kløvstien Open
tagline: Time trial fra Åndalsnes til Trollstigplatået
description: Årlig uoffisielt stiløp fra Åndalsnes sentrum til Trollstigplatået. 17 km og 875 høydemeter. Neste løp lørdag 17. oktober 2026 kl. 10:00.
url: https://klovstien.no
baseurl: ""
lang: nb-NO
timezone: Europe/Oslo
title_separator: " · "
logo: /assets/apple-touch-icon.png
author:
  name: Hans Kristian Smedsrød Engdahl
  email: hans@naerdetalvor.no
markdown: kramdown
highlighter: rouge
permalink: pretty
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - Kløvstien_Open_2025.gpx
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/og.jpg
        width: 1200
        height: 630
        alt: Trollstigvegen under Stigfossen i Isterdalen.

race:
  name: Kløvstien Open
  year: 2026
  date_iso: "2026-10-17"
  date_display: Lørdag 17. oktober 2026
  time: "10:00"
  distance: 17 km
  elevation: 875 høydemeter
  start: Åndalsnes sentrum
  finish: Trollstigplatået
  registration_url: https://www.fjelldatabasen.no/races/klovstien-open/2026/17km
  registration_label: Fjelldatabasen.no
  years: [2026, 2025, 2024]

analytics:
  ga4: G-TJLZ3K36KE
