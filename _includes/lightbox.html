<dialog class="lightbox" id="lightbox" aria-label="Bildegalleri">
  <form method="dialog">
    <button class="lightbox-close" type="submit" aria-label="Lukk galleriet">Lukk</button>
  </form>
  <button class="lightbox-nav lightbox-prev" type="button" aria-label="Forrige bilde">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 3 L6 12 L16 21 Z"/></svg>
  </button>
  <figure class="lightbox-frame">
    <img class="lightbox-image" alt="">
    <figcaption class="lightbox-caption"></figcaption>
    <p class="lightbox-counter"></p>
  </figure>
  <button class="lightbox-nav lightbox-next" type="button" aria-label="Neste bilde">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 3 L18 12 L8 21 Z"/></svg>
  </button>
</dialog>
